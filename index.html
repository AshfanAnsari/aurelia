<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F6F7" />
    <script>
      /* Apply the saved theme before first paint (the app keeps it in sync). */
      try {
        var dark = localStorage.getItem('aurelia-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', dark ? '#0E0E11' : '#F6F6F7');
      } catch (e) {}
    </script>
    <link rel="icon" href="data:," />
    <title>AURELIA — Haute Joaillerie | Elegance Redefined</title>
    <meta name="description" content="AURELIA Haute Joaillerie — bespoke fine jewellery since 1924. Explore rings, necklaces, earrings and more, shop the collection, and configure your solitaire." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Marcellus&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        { "@type": "Organization", "name": "AURELIA Haute Joaillerie", "foundingDate": "1924", "email": "care@aurelia.example", "description": "Bespoke fine jewellery, handcrafted since 1924." },
        { "@type": "WebSite", "name": "AURELIA", "inLanguage": "en" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
